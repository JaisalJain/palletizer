# Palletizing cell — single source of truth for all dimensions and poses.
# Units: meters, radians, kg. World frame: floor level, directly below the robot base axis.
# +x runs along the conveyor (direction of travel), +y points from the robot toward the conveyor.
# Read by: palletizer_description (robot xacro), palletizer_gazebo (world xacro, launch),
#          palletizer_tools (spawner, conveyor controller, tests).

world_name: palletizing_cell

robot:
  ur_type: ur10e
  pedestal:
    size: [0.25, 0.25, 0.70]      # x, y, z; base_link sits on top of it
    xy: [0.0, 0.0]
    mass: 80.0
  # Reference arm configuration (elbow up, wrist down, arm toward the pallet side): the IK
  # seed; its pan is rotated toward each target.
  home: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  # Park / start pose: TCP at (0.35, 0.08, 1.65), cup down. Outside BOTH camera views (the
  # pallet camera must see the station while the arm waits) and high enough that a carried
  # box clears a full pallet sliding out of the station (stack top <= 1.2 m + deck).
  park: [-0.282, -1.842, 0.948, -0.677, -1.571, -0.282]

gripper:
  body_radius: 0.04               # suction body cylinder
  body_length: 0.12
  body_mass: 0.6
  cup_radius: 0.05                # suction cup
  cup_length: 0.03
  cup_mass: 0.1
  # suction_tcp is at the cup face: flange + body_length + cup_length along the tool z axis
  max_gap: 0.008                  # max distance cup face -> box top to allow a grasp
  max_offset: 0.02                # max lateral offset cup axis -> top-face center
  max_tilt: 0.15                  # max angle between cup axis and box top normal (rad)
  ft_rate: 100.0                  # F/T sensor on suction_cup_joint [Hz]

conveyor:
  length: 3.0
  belt_width: 0.6
  belt_top_z: 0.80
  belt_thickness: 0.05
  y: 0.80                         # belt centerline
  x_start: -2.55                  # upstream end (boxes spawn here)
  x_end: 0.45                     # downstream end (end-stop bumper)
  speed: 0.25                     # belt surface speed, m/s
  frame_color: [0.35, 0.37, 0.40, 1.0]
  belt_color: [0.08, 0.08, 0.08, 1.0]
  # Independently driven zones (zero-pressure accumulation), upstream -> downstream.
  # Each zone has a photo-eye at eye_x near its downstream end. A zone runs if its eye is
  # clear or the next zone is running. The pick zone stops when its eye is blocked and
  # holds until /conveyor_controller/resume.
  # Gap guarantee: a box waiting at a zone's eye is >= 0.10 m behind the box downstream,
  # because next_eye_x - max_box_extent (0.8 m diagonal at 25 deg) - eye_x >= 0.10.
  zones:
    - {name: infeed, x_min: -2.55, x_max: -1.55, eye_x: -1.60}
    - {name: accum,  x_min: -1.55, x_max: -0.65, eye_x: -0.70}
    - {name: pick,   x_min: -0.65, x_max: 0.45,  eye_x: 0.25}
  photo_eye:
    height: 0.05                  # beam height above the belt top
    rate: 50.0                    # Hz
    offset: 0.12                  # emitter / reflector posts this far outside the belt edges
                                  # (boxes up to 0.8 m wide at 25 deg overhang the 0.6 m belt)
    blocked_range: 0.80           # beam reading below this (m) = blocked (clear = no return);
                                  # a reading below the sensor's min range also = blocked
    debounce: 3                   # consecutive samples for a state change while the zone
                                  # moves (a box corner crossing the beam can flicker)
    removal_confirm: 0.5          # s the pick eye must stay clear, with the belt stopped, to
                                  # count as "box removed" (a stopped box's front edge sits on
                                  # the beam line and can flicker indefinitely)
  transit_timeout_factor: 1.5     # a zone that claims a box but whose eye stays clear while
                                  # running longer than factor x (zone length / speed) is reset
  settle_time: 0.3                # s the pick eye must stay blocked with belt stopped = box ready

pick_zone:
  # Nominal pick area center on the belt surface. Boxes stop with their leading edge at the
  # pick photo-eye (conveyor.zones[pick].eye_x), so their centers land in [-0.15, +0.15].
  xyz: [0.0, 0.80, 0.80]
  roi_x: [-0.65, 0.45]            # perception ROI along the belt (world x)

pallet_station:
  # The AREA where the pallet conveyor delivers pallets. This is all the robot knows: pallet
  # dims and pose are measured by pallet_perception (overhead RGB-D above the station).
  center_xy: [0.0, -0.60]
  area: [1.32, 0.92]              # x, y extent a pallet (incl. its pose tolerance) lies within
  max_stack_height: 1.2           # limit for the box-top height above the measured deck
  max_deck_z: 0.16                # highest pallet deck the station accepts [m] (the offline
                                  # reachability map models the station floor up to it)
  # pallet frame (packing): origin at the deck corner nearest the robot on the -u side;
  # v = pallet axis pointing away from the robot, u = v rotated by +90 deg, z above the deck.

pallet_camera:
  xyz: [0.0, -0.60, 2.80]         # above the station centre; the whole station area and a
                                  # max-height stack are in view, above the robot's workspace
  rpy: [0.0, 1.5708, 1.5708]      # looking straight down, image rows along world y
                                  # (the long image side along x, the pallet length)
  width: 800
  height: 600
  hfov: 0.9                       # rad; ~3.2 mm/pixel at the deck, ~1.8 mm at 1.2 m
  rate: 5.0                       # Hz
  near: 0.1
  far: 4.0
  depth_noise_stddev: 0.002       # same noise model as the conveyor camera
  pixel_center_offset: 0.5
  mast_xy: [0.0, -1.55]           # outside the pallet lane
  mast_size: [0.08, 0.08, 2.90]

camera:
  xyz: [0.0, 0.80, 2.30]          # 1.5 m above the belt at the pick zone
  # camera link looks straight down: +x of the camera link (gz optical axis) points to -z world
  rpy: [0.0, 1.5708, 0.0]
  width: 640
  height: 480
  hfov: 1.2                       # rad (~69 deg)
  rate: 15.0                      # Hz
  near: 0.1
  far: 4.0
  depth_noise_stddev: 0.002       # Gaussian depth noise [m]
  # gz-sensors reports cx = width/2, cy = height/2 but renders pixel i centred at i + 0.5
  # (OpenCV convention puts pixel centres at integer coordinates). Measured: a constant
  # half-pixel (1.34 mm at 1.25 m) grasp-point offset without this correction.
  pixel_center_offset: 0.5
  mast_xy: [0.0, 1.45]
  mast_size: [0.08, 0.08, 2.40]

perception:
  frames: 5                       # depth frames averaged per detection (box is stationary)
  roi_margin_y: 0.16              # ROI = pick_zone.roi_x x (belt width + margin); boxes up to
                                  # 0.6 m at 25 deg span 0.80 m and overhang the 0.6 m belt
  min_object_height: 0.04         # above belt top [m]
  max_object_height: 0.60
  plateau_tol: 0.008              # top-face pixels within this of the plateau height [m]
  plateau_bin: 0.003              # height histogram bin [m]
  min_top_area: 0.02              # min top-face area [m^2] (smallest box 0.2 x 0.2 = 0.04)
  min_fill_ratio: 0.93            # pixel area / fitted rectangle area; lower = not one box
  max_side: 0.66                  # a top face longer than this is treated as merged boxes
  color_split_min_dist: 12.0      # min RGB cluster distance (0-255) to split merged boxes
  detect_timeout: 3.0             # s
  # Refuse to detect while the robot occludes the box: the tool (TF) over the ROI, or any
  # pixel over the ROI higher than a box can be (the folded elbow after a near-row place
  # hangs over the ROI but high; it only matters if it covers the view)
  occlusion_links: [wrist_2_link, wrist_3_link, suction_cup]
  occlusion_margin: 0.10          # [m] around the ROI rectangle
  occluder_clearance: 0.05        # pixels > max_object_height + this above the belt = occluder

pallet_perception:
  frames: 4                       # depth frames averaged (the stack is static between places)
  deck_z_range: [0.05, 0.40]      # plausible deck-top heights above the floor [m]
  plateau_tol: 0.008              # deck / top-face pixels within this of their plateau [m]
  plateau_bin: 0.003              # height histogram bin [m]
  deck_close: 0.10                # close gaps between deck boards up to this [m]
  min_deck_area: 0.25             # [m^2]
  min_side: 0.4                   # a deck side shorter than this is not a pallet [m]
  change_threshold: 0.015         # per-pixel height change that counts [m]
  min_change_area: 0.0015         # changed area worth looking at [m^2] (15 x 100 mm)
  new_box_tol: 0.02               # new top-face pixels within this of the commanded top [m]
  min_new_box_fill: 0.85          # measured pixel area / fitted rectangle, else not detected
  shift_threshold: 0.020          # a placed box moved more than this -> SHIFT event [m]
  collapse_dz: 0.05               # a top dropped more than this -> COLLAPSE event [m]
  monitor_period: 2.0             # [s] between stack checks while the view is clear
  disagreement_tol: 0.015         # perceived vs placement-record height map [m]
  measure_timeout: 60.0           # [s] to get an unoccluded view
  # (upper_arm_link's origin is the shoulder, always on the base axis next to the station)
  occlusion_links: [forearm_link, wrist_1_link, wrist_2_link, wrist_3_link, suction_cup]
  occlusion_margin: 0.10          # [m] around the station area
  occluder_clearance: 0.25        # a pixel over the station higher than deck + max stack +
                                  # this is an occluder (robot / carried box) -> frame unusable

motion:
  planning_group: manipulator
  tcp_link: suction_tcp
  ptp_velocity_scaling: 1.0        # (v2 speed-up; v1: 0.6 / 0.4 / 0.25 / 0.25 / 0.08)
  ptp_acceleration_scaling: 1.0
  lin_velocity_scaling: 0.6        # of pilz cartesian limits (1.0 m/s)
  lin_acceleration_scaling: 0.45
  lin_slow_velocity_scaling: 0.1   # last approach centimetres (descent into contact / release)
  lin_fallback_scaling: [[0.25, 0.25], [0.1, 0.1]]  # velocity/acceleration, in turn, when a
                                   # LIN plan exceeds a joint limit (Pilz error -1): the same
                                   # line, slower (0.1: arm nearly stretched at far top corners)
  slow_zone: 0.03                  # [m] length of the slow final approach
  pre_grasp_height: 0.15           # above the detected top-face center
  pick_gap: 0.003                  # cup face this far above the top face when suction turns on
  lift_clearance: 0.20             # carried box bottom >= belt top + this before swinging
                                   # (clears the conveyor frame and the end stop; queued boxes
                                   # are never passed because swings go via the +x side)
  stack_clearance: 0.08            # carried box bottom >= tallest placed stack + this at the hub
  hub_radius: 0.60                 # transit waypoint: TCP this far from the base axis, at the
                                   # bearing of the next target and at transit height
  swing_bearing: 0.0               # conveyor <-> pallet swings pass the TCP bearing (world
                                   # yaw) through this direction: 0 = +x, the downstream side
                                   # where no queued boxes are
  pre_place_height: 0.15           # above the target top-face center
  release_gap: 0.005               # box bottom this far above the resting surface at release
  retreat_height: 0.15
  grasp_confirm_timeout: 1.0       # s
  release_confirm_timeout: 1.0
  release_settle: 0.15             # s to wait after release before retreating
  weigh_window: 0.25               # s F/T averaging window
  weigh_settle: 0.15               # s to wait after the lift before weighing
  planning_time: 5.0
  ompl_fallback: true
  # Collision model of the carried box: slightly smaller than measured so that the surface it
  # rests on (belt / pallet / box below) and neighbours placed flush don't count as contacts.
  held_box_shrink_xy: 0.003        # per side [m]
  held_box_bottom_clearance: 0.015 # [m] trimmed from the bottom

reachability:
  file: reachability_ur10e.npz     # in palletizer_motion/config (built offline, world frame)
  grid_step: 0.05                  # [m] box-centre positions over the station area
  edge_inset: 0.08                 # smallest box half-size considered [m]
  top_z: [0.25, 1.45, 0.05]        # [first, last, step] box-top height, WORLD z [m]
  min_coverage: 1.0                # usable stack height (per measured pallet) = highest level
                                   # with this coverage over the pallet footprint

packing:
  mode: mixed                      # mixed (v1 planners) | single_sku (layer patterns)
  planner: heuristic               # mixed mode: naive | heuristic
  resolution: 0.01                 # height-map grid [m]
  cell_overlap_tol: 0.003          # a footprint covers a cell if it overlaps it by > this [m]
  perception_merge: true           # plan on the perceived height map (merged with the record)
  map_wait: 3.0                    # [s] wait for a perceived map that includes the last commit
  # single_sku mode
  pattern_gap: 0.005               # gap between boxes in a layer pattern [m]
  sku_tolerance: 0.010             # same SKU if every measured dim is within this [m]
  pattern:
    priority: count                # count: max boxes/layer, column stack if no same-count
                                   # interlock | interlock: may drop boxes/layer to interlock
    interlock_drop: 1              # boxes per layer 'interlock' may give up
    min_interlock: 0.3             # fraction of boxes that must bridge two below
    max_layouts: 400
  gap: 0.01                        # horizontal gap left between boxes [m] (placement tolerance)
  candidate_step: 0.05             # coarse grid of footprint corners [m] (+ contact points)
  support_ratio: 0.75              # min supported fraction of the base area
  support_tol: 0.005               # cell supports the box if within this of the resting height
  mass_ratio: 1.5                  # no box heavier than this x any box directly under it
  motion_check_max: 12             # max motion-feasibility checks (current scene) per plan
  reach_over_clearance: 0.10       # stacks between the robot and the target must be at least
                                   # this much below the target resting height + pre_place_height
  heuristic:                       # score = lower is better (tuned offline on seeds 100-159,
                                   # disjoint from the benchmark seeds; see docs/RESULTS.md)
    w_rest_height: 0.3             # resting height of the box bottom [m]
    w_deck: 3.0                    # pallet-deck area newly covered (fraction of the deck):
                                   # keeps the deck for boxes that cannot stand on another box
    w_max_height: 0.5              # increase of the pallet's max height [m]
    w_far: 0.6                     # prefers far rows: (1 - v_far/pallet_width)
    w_left: 0.05                   # tie-break toward low u
    w_contact: 0.4                 # minus fraction of the box perimeter in contact
    w_roughness: 0.3               # height-map roughness change [m]
    rerank_top_n: 25               # re-rank the best n by the big-box reservation term:
    reserve_footprint: [0.5, 0.5]  # planner HYPERPARAMETER (not a box size the robot relies
                                   # on): keep a flat region of this size free for a large
                                   # box, tuned offline on the mixed stream; boxes are measured
    w_reserve: 1.0                 # penalty for destroying the last such region
    w_regions: 0.002               # bonus per remaining region position (capped at 200)
  physics:
    enabled: true
    top_k: 3                       # physics-check only the best k candidates
    sim_time: 1.5                  # [s]
    timestep: 0.004167             # 1/240 s
    max_displacement: 0.010        # [m]
    max_rotation_deg: 2.0
    friction: 0.5
    drop_height: 0.002             # candidate spawned this far above its resting height

# Acceptance thresholds (Milestone B). Do not loosen.
perception_eval:
  dim_mean_mm: 5.0
  dim_max_mm: 12.0
  center_mean_mm: 5.0
  yaw_mean_deg: 1.5

# Acceptance thresholds (v2 Milestone B pallet perception). Do not loosen.
pallet_perception_eval:
  dims_mm: 10.0                    # measured pallet deck dims
  pose_mm: 10.0                    # measured pallet centre
  yaw_deg: 1.0
  height_map_mm: 10.0              # perceived height map vs ground truth, occupied cells
  placement_agree_mm: 5.0          # camera placement error vs ground-truth placement error

# Acceptance thresholds (Milestone C pick_place test). Do not loosen.
pick_place_test:
  min_success: 19                  # of 20
  place_err_mm: 15.0
  yaw_err_deg: 3.0
  neighbor_disp_mm: 10.0

spawner:
  # The spawner plays the UPSTREAM process: it is the only reader of box sizes. The robot's
  # decision-making nodes load this file with role='robot', which strips this section.
  rate: 0.5                       # spawn attempts per second (0 = only on demand);
                                  # a box is spawned only when the min_gap allows
  yaw_range: 0.4363               # +/- rad (25 deg) on the belt
  rear_margin: 0.03               # spawned box rear edge this far inside the belt start
  min_gap: 0.12                   # spawn only if the new box ends up >= this far (m, along x)
                                  # behind the rearmost box on the infeed
  # mode:=mixed (v1): uniformly random boxes
  mixed:
    size_min: [0.2, 0.2, 0.15]
    size_max: [0.6, 0.6, 0.40]
    mass_range: [1.0, 10.0]
  # mode:=single_sku: SKU catalog. Key = nominal module L x W x H [mm] (ISO 3394 plan
  # modules on the 1200 x 800 grid, plus non-modular sizes). size = external carton size [m]:
  # modular cartons are made slightly UNDER the module (594 x 394 for 600 x 400) so they fit
  # the pallet with a placement gap. mass: uniform range [kg] (max/min <= 1.5).
  # Select with box_spawner params sku:=<key> or order:="<key>:<count>, <key>:<count>";
  # a key that is not in the catalog is parsed as external dims in mm ("347x253x219").
  catalog:
    600x400x400: {size: [0.594, 0.394, 0.400], mass: [8.0, 11.5]}    # UR10e payload 12.5 kg
    600x400x300: {size: [0.594, 0.394, 0.300], mass: [7.0, 10.5]}
    400x300x300: {size: [0.394, 0.294, 0.300], mass: [5.0, 7.5]}
    400x300x200: {size: [0.394, 0.294, 0.200], mass: [4.0, 6.0]}
    300x200x200: {size: [0.294, 0.194, 0.200], mass: [2.0, 3.0]}
    500x300x250: {size: [0.494, 0.294, 0.250], mass: [5.0, 7.5]}
    450x350x300: {size: [0.450, 0.350, 0.300], mass: [6.0, 9.0]}      # non-modular
    520x320x250: {size: [0.520, 0.320, 0.250], mass: [5.0, 7.5]}      # non-modular
    380x280x220: {size: [0.380, 0.280, 0.220], mass: [3.0, 4.5]}      # non-modular
  default_mass: [3.0, 4.5]        # SKUs given as raw dims (not in the catalog)

exchanger:
  # Simulated pallet conveyor / forklift (plant equipment). The ONLY reader of pallet sizes;
  # stripped from the robot's view of this file like `spawner`.
  pallet_types:                   # deck length x width x height [m], mass [kg]
    EUR:      {size: [1.2, 0.8, 0.144], mass: 25.0}      # EUR 1 (ISO 6780)
    1000x800: {size: [1.0, 0.8, 0.144], mass: 20.0}
    HALF:     {size: [0.8, 0.6, 0.144], mass: 10.0}      # EUR 6 half pallet
  order: [EUR]                    # pallet types delivered in turn (the last one repeats);
                                  # overridden by the pallet_exchanger param `pallets`
  lane_y: -0.60                   # pallets slide along +x on this line
  entry_x: -2.9                   # a new pallet comes in from here ...
  exit_x: 2.9                     # ... and a full one leaves to here (then it is removed)
  speed: 0.35                     # [m/s]
  accel: 0.4                      # [m/s^2]
  # Delivered pose = station centre + uniform noise. Must stay inside pallet_station.area
  # (the world-frame reachability map covers it): EUR at 1.5 deg + 2 cm spans 1.26 x 0.87 m.
  pose_noise_xy: 0.02             # +/- [m]
  pose_noise_yaw: 0.026           # +/- [rad] (1.5 deg)
