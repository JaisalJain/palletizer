# Palletizing cell — single source of truth for all dimensions and poses.
# Units: meters, radians, kg. World frame: floor level, directly below the robot base axis.
# +x runs along the conveyor (direction of travel), +y points from the robot toward the conveyor.
# Read by: palletizer_description (robot xacro), palletizer_gazebo (world xacro, launch),
#          palletizer_tools (spawner, conveyor controller, tests).

world_name: palletizing_cell

robot:
  ur_type: ur10e
  pedestal:
    size: [0.25, 0.25, 0.70]      # x, y, z; base_link sits on top of it
    xy: [0.0, 0.0]
    mass: 80.0
  # Joint home pose: arm parked over the pallet side, out of the overhead camera's view,
  # suction cup pointing down. (pan = +pi/2 would put the same pose above the pick zone.)
  home: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]

gripper:
  body_radius: 0.04               # suction body cylinder
  body_length: 0.12
  body_mass: 0.6
  cup_radius: 0.05                # suction cup
  cup_length: 0.03
  cup_mass: 0.1
  # suction_tcp is at the cup face: flange + body_length + cup_length along the tool z axis
  max_gap: 0.008                  # max distance cup face -> box top to allow a grasp
  max_offset: 0.02                # max lateral offset cup axis -> top-face center
  max_tilt: 0.15                  # max angle between cup axis and box top normal (rad)
  ft_rate: 100.0                  # F/T sensor on suction_cup_joint [Hz]

conveyor:
  length: 3.0
  belt_width: 0.6
  belt_top_z: 0.80
  belt_thickness: 0.05
  y: 0.80                         # belt centerline
  x_start: -2.55                  # upstream end (boxes spawn here)
  x_end: 0.45                     # downstream end (end-stop bumper)
  speed: 0.25                     # belt surface speed, m/s
  frame_color: [0.35, 0.37, 0.40, 1.0]
  belt_color: [0.08, 0.08, 0.08, 1.0]
  # Independently driven zones (zero-pressure accumulation), upstream -> downstream.
  # Each zone has a photo-eye at eye_x near its downstream end. A zone runs if its eye is
  # clear or the next zone is running. The pick zone stops when its eye is blocked and
  # holds until /conveyor_controller/resume.
  # Gap guarantee: a box waiting at a zone's eye is >= 0.10 m behind the box downstream,
  # because next_eye_x - max_box_extent (0.8 m diagonal at 25 deg) - eye_x >= 0.10.
  zones:
    - {name: infeed, x_min: -2.55, x_max: -1.55, eye_x: -1.60}
    - {name: accum,  x_min: -1.55, x_max: -0.65, eye_x: -0.70}
    - {name: pick,   x_min: -0.65, x_max: 0.45,  eye_x: 0.25}
  photo_eye:
    height: 0.05                  # beam height above the belt top
    rate: 50.0                    # Hz
    blocked_range: 0.62           # beam reading below this (m) = blocked (clear = no return)
  settle_time: 0.3                # s the pick eye must stay blocked with belt stopped = box ready

pick_zone:
  # Nominal pick area center on the belt surface. Boxes stop with their leading edge at the
  # pick photo-eye (conveyor.zones[pick].eye_x), so their centers land in [-0.15, +0.15].
  xyz: [0.0, 0.80, 0.80]
  roi_x: [-0.65, 0.45]            # perception ROI along the belt (world x)

pallet:
  size: [1.2, 0.8, 0.144]         # EUR pallet
  center_xy: [0.0, -0.60]
  mass: 25.0
  max_stack_height: 1.2           # above the pallet top surface
  # pallet_origin frame = corner of the pallet's top surface nearest the robot, on the -x side
  # (computed: x = cx - sx/2, y = cy + sy/2, z = sz), axes aligned with world.

camera:
  xyz: [0.0, 0.80, 2.30]          # 1.5 m above the belt at the pick zone
  # camera link looks straight down: +x of the camera link (gz optical axis) points to -z world
  rpy: [0.0, 1.5708, 0.0]
  width: 640
  height: 480
  hfov: 1.2                       # rad (~69 deg)
  rate: 15.0                      # Hz
  near: 0.1
  far: 4.0
  depth_noise_stddev: 0.002       # Gaussian depth noise [m]
  # gz-sensors reports cx = width/2, cy = height/2 but renders pixel i centred at i + 0.5
  # (OpenCV convention puts pixel centres at integer coordinates). Measured: a constant
  # half-pixel (1.34 mm at 1.25 m) grasp-point offset without this correction.
  pixel_center_offset: 0.5
  mast_xy: [0.0, 1.45]
  mast_size: [0.08, 0.08, 2.40]

perception:
  frames: 5                       # depth frames averaged per detection (box is stationary)
  roi_margin_y: 0.05              # ROI = pick_zone.roi_x x (belt width + margin)
  min_object_height: 0.04         # above belt top [m]
  max_object_height: 0.60
  plateau_tol: 0.008              # top-face pixels within this of the plateau height [m]
  plateau_bin: 0.003              # height histogram bin [m]
  min_top_area: 0.02              # min top-face area [m^2] (smallest box 0.2 x 0.2 = 0.04)
  min_fill_ratio: 0.93            # pixel area / fitted rectangle area; lower = not one box
  max_side: 0.66                  # a top face longer than this is treated as merged boxes
  color_split_min_dist: 12.0      # min RGB cluster distance (0-255) to split merged boxes
  detect_timeout: 3.0             # s

# Acceptance thresholds (Milestone B). Do not loosen.
perception_eval:
  dim_mean_mm: 5.0
  dim_max_mm: 12.0
  center_mean_mm: 5.0
  yaw_mean_deg: 1.5

spawner:
  rate: 0.5                       # spawn attempts per second (0 = only on demand);
                                  # a box is spawned only when the min_gap allows
  size_min: [0.2, 0.2, 0.15]
  size_max: [0.6, 0.6, 0.40]
  mass_range: [1.0, 10.0]
  yaw_range: 0.4363               # +/- rad (25 deg)
  rear_margin: 0.03               # spawned box rear edge this far inside the belt start
  min_gap: 0.12                   # spawn only if the new box ends up >= this far (m, along x)
                                  # behind the rearmost box on the infeed
