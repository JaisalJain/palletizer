# Palletizing cell — single source of truth for all dimensions and poses.
# Units: meters, radians, kg. World frame: floor level, directly below the robot base axis.
# +x runs along the conveyor (direction of travel), +y points from the robot toward the conveyor.
# Read by: palletizer_description (robot xacro), palletizer_gazebo (world xacro, launch),
#          palletizer_tools (spawner, conveyor controller, tests).

world_name: palletizing_cell

robot:
  ur_type: ur10e
  pedestal:
    size: [0.25, 0.25, 0.70]      # x, y, z; base_link sits on top of it
    xy: [0.0, 0.0]
    mass: 80.0
  # Joint home pose: arm parked over the pallet side, out of the overhead camera's view,
  # suction cup pointing down. (pan = +pi/2 would put the same pose above the pick zone.)
  home: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]

gripper:
  body_radius: 0.04               # suction body cylinder
  body_length: 0.12
  body_mass: 0.6
  cup_radius: 0.05                # suction cup
  cup_length: 0.03
  cup_mass: 0.1
  # suction_tcp is at the cup face: flange + body_length + cup_length along the tool z axis
  max_gap: 0.008                  # max distance cup face -> box top to allow a grasp
  max_offset: 0.02                # max lateral offset cup axis -> top-face center
  max_tilt: 0.15                  # max angle between cup axis and box top normal (rad)
  ft_rate: 100.0                  # F/T sensor on suction_cup_joint [Hz]

conveyor:
  length: 3.0
  belt_width: 0.6
  belt_top_z: 0.80
  belt_thickness: 0.05
  y: 0.80                         # belt centerline
  x_start: -2.55                  # upstream end (boxes spawn here)
  x_end: 0.45                     # downstream end (end-stop bumper)
  speed: 0.25                     # belt surface speed, m/s
  frame_color: [0.35, 0.37, 0.40, 1.0]
  belt_color: [0.08, 0.08, 0.08, 1.0]
  # Independently driven zones (zero-pressure accumulation), upstream -> downstream.
  # Each zone has a photo-eye at eye_x near its downstream end. A zone runs if its eye is
  # clear or the next zone is running. The pick zone stops when its eye is blocked and
  # holds until /conveyor_controller/resume.
  # Gap guarantee: a box waiting at a zone's eye is >= 0.10 m behind the box downstream,
  # because next_eye_x - max_box_extent (0.8 m diagonal at 25 deg) - eye_x >= 0.10.
  zones:
    - {name: infeed, x_min: -2.55, x_max: -1.55, eye_x: -1.60}
    - {name: accum,  x_min: -1.55, x_max: -0.65, eye_x: -0.70}
    - {name: pick,   x_min: -0.65, x_max: 0.45,  eye_x: 0.25}
  photo_eye:
    height: 0.05                  # beam height above the belt top
    rate: 50.0                    # Hz
    blocked_range: 0.62           # beam reading below this (m) = blocked (clear = no return)
  settle_time: 0.3                # s the pick eye must stay blocked with belt stopped = box ready

pick_zone:
  # Nominal pick area center on the belt surface. Boxes stop with their leading edge at the
  # pick photo-eye (conveyor.zones[pick].eye_x), so their centers land in [-0.15, +0.15].
  xyz: [0.0, 0.80, 0.80]
  roi_x: [-0.65, 0.45]            # perception ROI along the belt (world x)

pallet:
  size: [1.2, 0.8, 0.144]         # EUR pallet
  center_xy: [0.0, -0.60]
  mass: 25.0
  max_stack_height: 1.2           # above the pallet top surface
  # pallet_origin frame = corner of the pallet's top surface nearest the robot, on the -x side
  # (computed: x = cx - sx/2, y = cy + sy/2, z = sz), axes aligned with world.

camera:
  xyz: [0.0, 0.80, 2.30]          # 1.5 m above the belt at the pick zone
  # camera link looks straight down: +x of the camera link (gz optical axis) points to -z world
  rpy: [0.0, 1.5708, 0.0]
  width: 640
  height: 480
  hfov: 1.2                       # rad (~69 deg)
  rate: 15.0                      # Hz
  near: 0.1
  far: 4.0
  depth_noise_stddev: 0.002       # Gaussian depth noise [m]
  # gz-sensors reports cx = width/2, cy = height/2 but renders pixel i centred at i + 0.5
  # (OpenCV convention puts pixel centres at integer coordinates). Measured: a constant
  # half-pixel (1.34 mm at 1.25 m) grasp-point offset without this correction.
  pixel_center_offset: 0.5
  mast_xy: [0.0, 1.45]
  mast_size: [0.08, 0.08, 2.40]

perception:
  frames: 5                       # depth frames averaged per detection (box is stationary)
  roi_margin_y: 0.05              # ROI = pick_zone.roi_x x (belt width + margin)
  min_object_height: 0.04         # above belt top [m]
  max_object_height: 0.60
  plateau_tol: 0.008              # top-face pixels within this of the plateau height [m]
  plateau_bin: 0.003              # height histogram bin [m]
  min_top_area: 0.02              # min top-face area [m^2] (smallest box 0.2 x 0.2 = 0.04)
  min_fill_ratio: 0.93            # pixel area / fitted rectangle area; lower = not one box
  max_side: 0.66                  # a top face longer than this is treated as merged boxes
  color_split_min_dist: 12.0      # min RGB cluster distance (0-255) to split merged boxes
  detect_timeout: 3.0             # s
  # Refuse to detect while the robot hangs over the pick ROI (it would occlude the box):
  occlusion_links: [upper_arm_link, forearm_link, wrist_1_link, wrist_2_link, wrist_3_link,
                    suction_cup]
  occlusion_margin: 0.30          # [m] around the ROI rectangle

motion:
  planning_group: manipulator
  tcp_link: suction_tcp
  ptp_velocity_scaling: 0.6
  ptp_acceleration_scaling: 0.4
  lin_velocity_scaling: 0.25       # of pilz cartesian limits (1.0 m/s)
  lin_acceleration_scaling: 0.25
  lin_slow_velocity_scaling: 0.08  # last approach centimetres (descent into contact / release)
  slow_zone: 0.03                  # [m] length of the slow final approach
  pre_grasp_height: 0.15           # above the detected top-face center
  pick_gap: 0.003                  # cup face this far above the top face when suction turns on
  lift_clearance: 0.20             # carried box bottom >= belt top + this before swinging
                                   # (clears the conveyor frame and the end stop; queued boxes
                                   # are never passed because swings go via the +x side)
  stack_clearance: 0.08            # carried box bottom >= tallest placed stack + this at the hub
  hub_radius: 0.60                 # transit waypoint: TCP this far from the base axis, at the
                                   # bearing of the next target and at transit height
  swing_bearing: 0.0               # conveyor <-> pallet swings pass the TCP bearing (world
                                   # yaw) through this direction: 0 = +x, the downstream side
                                   # where no queued boxes are
  pre_place_height: 0.15           # above the target top-face center
  release_gap: 0.005               # box bottom this far above the resting surface at release
  retreat_height: 0.15
  grasp_confirm_timeout: 1.0       # s
  release_confirm_timeout: 1.0
  release_settle: 0.4              # s to wait after release before retreating
  weigh_window: 0.4                # s F/T averaging window
  weigh_settle: 0.3                # s to wait after the lift before weighing
  planning_time: 5.0
  ompl_fallback: true
  # Collision model of the carried box: slightly smaller than measured so that the surface it
  # rests on (belt / pallet / box below) and neighbours placed flush don't count as contacts.
  held_box_shrink_xy: 0.003        # per side [m]
  held_box_bottom_clearance: 0.015 # [m] trimmed from the bottom

reachability:
  file: reachability_ur10e.npz     # in palletizer_motion/config (built offline)
  grid_step: 0.05                  # [m] over the pallet footprint (box-center positions)
  edge_inset: 0.10                 # smallest possible box half-size
  top_heights: [0.15, 1.20, 0.05]  # [first, last, step] box-top height above pallet top
  min_coverage: 1.0                # usable stack height = highest level with this coverage

packing:
  planner: heuristic               # naive | heuristic
  resolution: 0.01                 # height-map grid [m]
  gap: 0.01                        # horizontal gap left between boxes [m] (placement tolerance)
  candidate_step: 0.05             # coarse grid of footprint corners [m] (+ contact points)
  support_ratio: 0.75              # min supported fraction of the base area
  support_tol: 0.005               # cell supports the box if within this of the resting height
  mass_ratio: 1.5                  # no box heavier than this x any box directly under it
  reach_over_clearance: 0.10       # stacks between the robot and the target must be at least
                                   # this much below the target resting height + pre_place_height
  heuristic:                       # score = lower is better (tuned offline on seeds 100-159,
                                   # disjoint from the benchmark seeds; see docs/RESULTS.md)
    w_rest_height: 0.3             # resting height of the box bottom [m]
    w_deck: 3.0                    # pallet-deck area newly covered (fraction of the deck):
                                   # keeps the deck for boxes that cannot stand on another box
    w_max_height: 0.5              # increase of the pallet's max height [m]
    w_far: 0.6                     # prefers far rows: (1 - v_far/pallet_width)
    w_left: 0.05                   # tie-break toward low u
    w_contact: 0.4                 # minus fraction of the box perimeter in contact
    w_roughness: 0.3               # height-map roughness change [m]
    rerank_top_n: 25               # re-rank the best n by the big-box reservation term:
    reserve_footprint: [0.5, 0.5]  # keep a flat region that can host a box this large
    w_reserve: 1.0                 # penalty for destroying the last such region
    w_regions: 0.002               # bonus per remaining region position (capped at 200)
  physics:
    enabled: true
    top_k: 3                       # physics-check only the best k candidates
    sim_time: 1.5                  # [s]
    timestep: 0.004167             # 1/240 s
    max_displacement: 0.010        # [m]
    max_rotation_deg: 2.0
    friction: 0.5
    drop_height: 0.002             # candidate spawned this far above its resting height

# Acceptance thresholds (Milestone B). Do not loosen.
perception_eval:
  dim_mean_mm: 5.0
  dim_max_mm: 12.0
  center_mean_mm: 5.0
  yaw_mean_deg: 1.5

# Acceptance thresholds (Milestone C pick_place test). Do not loosen.
pick_place_test:
  min_success: 19                  # of 20
  place_err_mm: 15.0
  yaw_err_deg: 3.0
  neighbor_disp_mm: 10.0

spawner:
  rate: 0.5                       # spawn attempts per second (0 = only on demand);
                                  # a box is spawned only when the min_gap allows
  size_min: [0.2, 0.2, 0.15]
  size_max: [0.6, 0.6, 0.40]
  mass_range: [1.0, 10.0]
  yaw_range: 0.4363               # +/- rad (25 deg)
  rear_margin: 0.03               # spawned box rear edge this far inside the belt start
  min_gap: 0.12                   # spawn only if the new box ends up >= this far (m, along x)
                                  # behind the rearmost box on the infeed
